# Qwen3-Omni runs as the conversational node of this server's Session graph on one H200 and sees the camera frames sent with the audio; the VAD node detects speech for it on the CPU.
config_cls: Qwen3OmniSessionPipelineConfig
model_path: Qwen/Qwen3-Omni-30B-A3B-Instruct

stages:
  image_encoder:
    gpu: 0
    gpu_memory_fraction: 0.017
  audio_encoder:
    gpu: 0
    gpu_memory_fraction: 0.017
  thinker:
    gpu: 0
    gpu_memory_fraction: 0.769
  talker_ar:
    gpu: 0
    gpu_memory_fraction: 0.123
  code2wav:
    gpu: 0
    gpu_memory_fraction: 0.014

session_nodes:
  vad:
    stages: [vad]
    inputs: ["input:pcm16", "input:session"]
  qwen_omni:
    stages: [preprocessing, image_encoder, audio_encoder, thinker, decode, talker_ar, code2wav]
    execution: sglang_omni.models.qwen3_omni.session_execution.create_session_execution_factory
    inputs:
      - "input:pcm16"
      - "input:session"
      - "input:image_frame"
      - "vad:session"
      - {kind: control, source: input, event: interrupt, preempt: true}

session_publish:
  vad: [session]
  qwen_omni: [pcm16, session, text_delta, transcript]
